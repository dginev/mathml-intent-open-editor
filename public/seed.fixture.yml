# Synthetic dev/e2e fixture — NOT the real Intent Open list (that lives in dginev/mathml-intent-open;
# the editor does not own it). A handful of representative entries, cloned ×DEV_MULTIPLIER to exercise
# the table at the 10k+ row target, and used by canonical.test.ts to guard the round-trip invariants
# (overloaded arities, the intent signature, multilingual speech, comments, the notations: shape).
- concept: abelian-category
  speech:
    en:
      - default: abelian category
  property: symbol
  area: category theory
  urls:
    - https://mathworld.wolfram.com/AbelianCategory.html
  notations:
    - mathml: <math><mi intent='abelian-category'>Ab</mi></math>
- concept: additive-inverse
  intent: additive-inverse($value)
  speech:
    en:
      - default: additive inverse of $value
    fr:
      - default: opposé de $value
  property: prefix
  area: algebra
  notations:
    - mathml: <math><mrow intent='additive-inverse($value)'><mo>-</mo><mi arg='value'>n</mi></mrow></math>
- concept: disjoint-union
  intent: disjoint-union($set)
  speech:
    en:
      - default: disjoint union over $set
  property: prefix
  area: set theory
  comment: also written with a large square-cup operator
  notations:
    - mathml: <math><mrow intent='disjoint-union($set)'><mo>⊔</mo><mi arg='set'>A</mi></mrow></math>
- concept: disjoint-union
  intent: disjoint-union($a,$b)
  speech:
    en:
      - default: disjoint union of $a and $b
  property: infix
  area: set theory
  notations:
    - mathml: <math><mrow intent='disjoint-union($a,$b)'><mi arg='a'>A</mi><mo>⊔</mo><mi arg='b'>B</mi></mrow></math>
- concept: factorial
  intent: factorial($n)
  speech:
    en:
      - default: $n factorial
  property: postfix
  area: combinatorics
  notations:
    - mathml: <math><mrow intent='factorial($n)'><mi arg='n'>n</mi><mo>!</mo></mrow></math>
- concept: imaginary-unit
  speech:
    en:
      - default: imaginary unit
  property: symbol
  area: complex analysis
  notations:
    - mathml: <math><mi intent='imaginary-unit'>i</mi></math>
- concept: power
  intent: power($base,$exponent)
  speech:
    en:
      - default: $base to the $exponent
    de:
      - default: $base hoch $exponent
  property: indexed
  area: arithmetic
  urls:
    - https://en.wikipedia.org/wiki/Exponentiation
  alias:
    - exponentiation
  notations:
    - mathml: <math><msup intent='power($base,$exponent)'><mi arg='base'>x</mi><mi arg='exponent'>n</mi></msup></math>
- concept: ratio
  intent: ratio($a,$b)
  speech:
    en:
      - default: ratio of $a to $b
  property: infix
  area: arithmetic
  notations:
    - mathml: <math><mfrac intent='ratio($a,$b)'><mi arg='a'>a</mi><mi arg='b'>b</mi></mfrac></math>
- concept: square-root
  intent: square-root($value)
  speech:
    en:
      - default: square root of $value
  property: prefix
  area: arithmetic
  notations:
    - mathml: <math><msqrt intent='square-root($value)'><mi arg='value'>x</mi></msqrt></math>
